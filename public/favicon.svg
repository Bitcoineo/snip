<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="#2563eb"/>
  <!-- Scissors blades -->
  <circle cx="11" cy="10" r="3.5" stroke="white" stroke-width="1.8" fill="none"/>
  <circle cx="11" cy="22" r="3.5" stroke="white" stroke-width="1.8" fill="none"/>
  <!-- Cutting lines -->
  <line x1="14" y1="12" x2="24" y2="18" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="14" y1="20" x2="24" y2="14" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Snip marks -->
  <line x1="22" y1="16" x2="28" y2="16" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.5"/>
</svg>
